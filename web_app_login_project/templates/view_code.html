<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Code: {{ filename }}</title>
</head>
<body>
    <h1>{{ project.title }} - Code File: {{ filename }}</h1>

    <pre>
        <code>
            {{ code_content }}
        </code>
    </pre>

    <a href="{{ url_for('view_project', project_id=project.id) }}">Back to Project Files</a>
    <a href="{{ url_for('user_landing') }}">Back to Dashboard</a>
</body>
</html>
